plugins {
    id 'java'
    id 'application'
}

group 'com.a.hero'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.googlecode.lanterna', name: 'lanterna', version: '3.1.1'
}

application {
    mainClass.set("hero.Application")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
